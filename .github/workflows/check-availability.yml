name: Check StartPlaying Availability

on:
  schedule:
    # Every 15 minutes, 6am-6pm Phoenix time (13:00-01:00 UTC, no DST in AZ)
    - cron: '*/15 0,13-23 * * *'
    # Hourly the rest of the day
    - cron: '0 1-12 * * *'
  # Lets you trigger it manually from the Actions tab in GitHub, useful for testing
  workflow_dispatch:

# Gives the workflow permission to commit back to the repo
permissions:
  contents: write

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated availability.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/availability.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update availability data"
          git push
