name: Check StartPlaying Availability

on:
  # Runs automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Lets you trigger it manually from the Actions tab in GitHub, useful for testing
  workflow_dispatch:

# Gives the workflow permission to commit back to the repo
permissions:
  contents: write

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated availability.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/availability.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update availability data"
          git push
