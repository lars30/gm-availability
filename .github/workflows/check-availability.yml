name: Check RoleCall Availability

on:
  # Runs automatically every hour during working hours, 8 AM-6 PM MST
  # (15:00-01:00 UTC; Arizona has no daylight saving)
  schedule:
    - cron: '0 15-23,0-1 * * *'
  # Lets you trigger it manually from the Actions tab in GitHub, useful for testing
  workflow_dispatch:

# Gives the workflow permission to commit back to the repo
permissions:
  contents: write

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated availability.json
        # Runs even if the previous step failed (partial data still gets
        # saved), while the overall run still shows as failed — which is
        # what triggers your GitHub email notification.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/availability.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update availability data"
          git push
